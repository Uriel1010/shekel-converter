name: Bug report
description: Report a conversion, currency-detection, or display problem.
body:
  - type: markdown
    attributes:
      value: Please remove account details, cookies, and order information from your report.
  - type: input
    id: version
    attributes:
      label: Extension and Chrome versions
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Public page URL
      description: Do not include private checkout links or sensitive query parameters.
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
      description: Include the displayed price, expected currency, fallback settings, and tax-toggle state if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Redacted screenshot (optional)

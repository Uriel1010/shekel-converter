name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check
      - name: Verify release version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./manifest.json").version) process.exit(1)'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/package.py
      - name: Publish extension archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "Shekel Converter $GITHUB_REF_NAME" --generate-notes
